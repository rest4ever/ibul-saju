<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉬고싶은청년 추천 모음</title>
<meta name="description" content="일본 여행 준비물·자취 가성비 템을 분류별로 골라 둔 모음">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F3EF">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 10/11 사용자 "글씨체가 진부하고 이상해, 디자인 너무 올드해" → 새로 짬
   - 예전 판은 Pretendard 를 이름만 적고 불러오지 않아서 윈도에선 맑은 고딕으로 보였음 → 웹폰트를 실제로 불러옴
   - 근거: Pretendard = 2026 디자이너들 사이 가장 인기 있는 무료 한글 폰트 중 하나 (AWEZARD 2026-05-01)
           큰 제목·대비 있는 글꼴 조합, 무채색 바탕 + 채도 높은 산호·노랑 포인트 (SpreadSimple 2026-04-21)
           카드(벤토)형 칸 나눔 (UniLink 2026-05-02, 업체 글이라 근거 약함)
           상품 사진은 여백 넉넉히 (SpreadSimple 2026-04-21) */

:root{--bg:#F5F3EF;--card:#FFFFFF;--soft:#F0EDE8;--ink:#141414;--sub:#6E6A64;--accent:#D93D17;--onaccent:#FFFFFF;
  --btn:#141414;--onbtn:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(40,30,20,.07);
  --head:"Pretendard Variable",Pretendard,sans-serif;--headw:800;--headls:-1.6px;
  --body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all}
.wrap{max-width:440px;margin:0 auto;padding:28px 16px 64px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:-.1px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{margin:14px 0 10px;font-family:var(--head);font-size:40px;line-height:1.12;font-weight:var(--headw);letter-spacing:var(--headls)}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:0 0 18px;color:var(--sub);font-size:15px}
.notice{margin:0;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--sub);font-size:12.5px;line-height:1.5}
.card{margin-top:22px;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.ph{position:relative;aspect-ratio:4/3;background:var(--soft)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.chip{position:absolute;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip.tag{left:12px;top:12px;background:var(--accent);color:var(--onaccent)}
.chip.note{left:12px;bottom:12px;background:rgba(0,0,0,.45);color:#fff;font-weight:500}
.body{padding:18px 18px 20px}
.name{margin:0;font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.3px}
.flav{margin:6px 0 0;color:var(--sub);font-size:13.5px}
.price{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 4px}
.price .lab{font-size:13.5px;color:var(--sub);font-weight:600}
.price .num{font-family:var(--head);font-size:38px;font-weight:var(--headw);letter-spacing:-1px;color:var(--accent);font-variant-numeric:tabular-nums}
.price .num small{font-size:20px;margin-left:2px}
/* 10/11 사용자: 가격을 가리는 퀴즈 버튼은 뺌 ("영상이 퀴즈가 아닌데 가리는 건 소용없어, 2번(정답 보인 화면)이 더 나아") — 제목 질문 + 바로 아래 정답 */
.set{margin:0 0 14px;text-align:right;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--soft);border-radius:16px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--sub);font-weight:600}
.tile .v{margin-top:2px;font-size:17px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;font-weight:500;color:var(--sub);margin-left:3px}
.when{margin:12px 0 0;color:var(--sub);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:16px;border-radius:16px;background:var(--btn);color:var(--onbtn);text-decoration:none;font-size:16px;font-weight:700}
.btn svg{width:18px;height:18px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
footer{margin-top:30px;color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--ink);font-weight:600}

/* 10/14 사용자 "인스타 링크에 제품이 구분 없이 쭉 스크롤해서 봐야 해서 너무 불편해" →
   분류 칩(화면 위에 붙어 있음) + 분류별 묶음 + 사진 없는 상품은 한 줄형 짧은 카드. 주소 뒤 #japan·#food 로 바로 그 분류가 열림 */
.cats{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:10px 16px;background:var(--bg);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:9px 14px;border-radius:99px;border:1px solid #E2DED7;background:var(--card);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cat small{font-weight:500;opacity:.7;margin-left:3px}
.group h3{margin:26px 0 0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.group .gsub{margin:4px 0 0;color:var(--sub);font-size:13px}
.row{display:grid;grid-template-columns:52px 1fr;gap:12px;margin-top:12px;padding:14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.ico{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.row .name{font-size:16px}
.row .why{margin:3px 0 0;color:var(--sub);font-size:13px;line-height:1.45}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row .meta span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
.row .meta .pr{background:var(--accent);color:#fff}
.row .btn{grid-column:1/-1;margin-top:2px;padding:12px;font-size:15px;border-radius:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>@rest4.life · 쉬고싶은청년</div>
  <h1>필요한 것만<br><em>골라 보세요</em></h1>
  <p class="lead">분류를 누르면 그 상품만 바로 보여요 👇</p>
  <p class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  <nav class="cats" id="cats" aria-label="분류"></nav>
  <main id="list"></main>
  <footer>
    가격·할인은 쿠팡에서 수시로 바뀌어요. 각 상품의 조회일 기준이에요.<br>
    직접 먹어 본 후기가 아니라 상품 정보와 가격을 정리한 거예요.<br>
    자취 먹거리 사진은 이해를 돕기 위한 연출 사진이에요.<br>
    <b>@rest4.life</b> · 쉬고싶은청년
  </footer>
</div>
<script>
// 상품 추가는 여기만 고치면 됨. link 는 쿠팡 파트너스 '간편 링크 만들기'로 만든 https://link.coupang.com/... 만 넣는다 (단축 주소 금지)
// img 는 상품 포장·상표가 없는 연출 사진만 (쿠팡 상품 사진은 저작권 때문에 쓰지 않음)
// 분류 (주소 #japan 처럼 열면 그 분류만)
const CATS = [
  { id: "japan", name: "일본 여행", sub: "가기 전에 미리 챙겨 두면 좋은 것" },
  { id: "food",  name: "자취 먹거리", sub: "한 끼·한 개당 가격 계산해 둔 것" }
];
// 일본 여행: 사진 없이 한 줄형 (상품 사진은 저작권 때문에 안 씀). 2026-10-14 쿠팡 판매량순 상위·상품 페이지 조회
const ROWS = [
  { cat: "japan", ico: "🔌", name: "플라이토 돼지코 3개", why: "일본은 100V·납작한 2핀 콘센트", price: 4000, meta: ["한 달 6,000명+ 구매", "상품평 4,621"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBIa6ZMse" },   // 상품 7858734625
  { cat: "japan", ico: "🔋", name: "팬톤 케이블 일체형 보조배터리 10000mAh", why: "비행기엔 들고만 타요 · 기내 충전 금지", price: 18900, meta: ["한 달 6,000명+ 구매", "상품평 26,550"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBMpSp4BU" },   // 상품 7925483056
  { cat: "japan", ico: "🪙", name: "카스토리 엔화 동전지갑 + 듀얼 파우치", why: "동전이 6종이라 금방 쌓여요", price: 3000, meta: ["상품평 379"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBPxOHTCS" },   // 상품 9494420428 (판매량 1위 코멧은 파트너스 링크 제한 상품)
  { cat: "japan", ico: "⚖️", name: "칼마 휴대용 디지털 손저울", why: "쇼핑 후 캐리어 무게 미리 재기", price: 6350, meta: ["한 달 4,000명+ 구매", "상품평 10,341"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBQwaaxMW" },   // 상품 80294222
  { cat: "japan", ico: "👜", name: "몽땅겟 접이식 보스턴백 (캐리어 결합)", why: "늘어난 쇼핑 짐 담기", price: 12900, meta: ["상품평 3,708"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBRzmbZwi" },   // 상품 7163409205
  { cat: "japan", ico: "🛍️", name: "원이네 포켓 장바구니", why: "일본은 비닐 쇼핑봉투가 유료", price: 2750, meta: ["한 달 200명+ 구매", "상품평 1,033"], checked: "2026-10-14", link: "https://link.coupang.com/a/hPBSvOLWuW" }   // 상품 6429285554
];
const PICKS = [
  {
    cat: "food",
    tag: "자취 간식",
    img: "img/egg.jpg",
    name: "맛꾼 맥반석 구운계란 30구",
    flavors: "찜질방 스타일 · 껍질만 까면 바로",
    price: 9900,          // 2026-10-12 쿠팡 조회
    count: 30, unit: "구", per: "1개",
    tiles: [["상품평", "19,425개"], ["최고·좋음", "84%"], ["한 달 구매", "1만 명+"], ["구성", "30구"]],
    checked: "2026-10-12",
    link: "https://link.coupang.com/a/hMYhkHU0LA"   // 2026-10-12 간편 링크 만들기 (상품 8529746863)
  },
  {
    cat: "food",
    tag: "자취 한 끼",
    img: "img/curry.jpg",
    name: "티아시아키친 커리 4종 세트",
    flavors: "치킨 마크니 · 게살 푸팟퐁 · 비프 마살라 · 스파이시 비프 마살라",
    price: 8300,          // 2026-10-11 쿠팡 조회
    count: 4, unit: "팩", per: "1인분 (170g)",
    tiles: [["별점", "4.5", "/ 5"], ["상품평", "17,541개"], ["전자레인지", "1분 30초", "700W"], ["한 달 구매", "2,000명+"]],
    checked: "2026-10-11",
    link: "https://link.coupang.com/a/hLnhGbs2M0"   // 2026-10-11 간편 링크 만들기 (상품 6593710826)
  }
];
const won = n => n.toLocaleString("ko-KR");
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const rowHTML = r => `
  <section class="row">
    <div class="ico" aria-hidden="true">${r.ico}</div>
    <div>
      <h2 class="name">${r.name}</h2>
      <p class="why">${r.why}</p>
      <div class="meta"><span class="pr">${won(r.price)}원</span>${r.meta.map(m => `<span>${m}</span>`).join("")}</div>
    </div>
    <a class="btn" href="${r.link}" target="_blank" rel="sponsored noopener">쿠팡에서 보기 ${arrow}</a>
  </section>`;
const cardHTML = p => `
  <section class="card">
    <div class="ph">
      ${p.img ? `<img src="${p.img}" alt="" loading="lazy">` : ""}
      <span class="chip tag">${p.tag}</span>
      ${p.img ? `<span class="chip note">연출 사진</span>` : ""}
    </div>
    <div class="body">
      <h2 class="name">${p.name}</h2>
      ${p.flavors ? `<p class="flav">${p.flavors}</p>` : ""}
      <div class="price"><span class="lab">${p.per}</span><span class="num">${won(Math.round(p.price / p.count))}<small>원</small></span></div>
      <p class="set">세트 ${won(p.price)}원 ÷ ${p.count}${p.unit}</p>
      <div class="bento">${p.tiles.map(t => `<div class="tile"><div class="k">${t[0]}</div><div class="v">${t[1]}${t[2] ? `<small>${t[2]}</small>` : ""}</div></div>`).join("")}</div>
      <p class="when">${p.checked.replace(/-/g, ".")} 쿠팡 기준 · 가격은 바뀔 수 있어요</p>
      ${p.link ? `<a class="btn" href="${p.link}" target="_blank" rel="sponsored noopener">쿠팡에서 보기 ${arrow}</a>`
               : `<a class="btn" aria-disabled="true">링크 준비 중</a>`}
    </div>
  </section>`;
function render(sel) {
  document.getElementById("cats").innerHTML =
    [{ id: "all", name: "전체" }, ...CATS].map(c => {
      const n = c.id === "all" ? ROWS.length + PICKS.length : ROWS.filter(r => r.cat === c.id).length + PICKS.filter(p => p.cat === c.id).length;
      return `<button class="cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${c.name}<small>${n}</small></button>`;
    }).join("");
  document.getElementById("list").innerHTML = CATS.filter(c => sel === "all" || sel === c.id).map(c => `
    <div class="group" id="g-${c.id}">
      <h3>${c.name}</h3><p class="gsub">${c.sub}</p>
      ${ROWS.filter(r => r.cat === c.id).map(rowHTML).join("")}
      ${PICKS.filter(p => p.cat === c.id).map(cardHTML).join("")}
    </div>`).join("");
  document.querySelectorAll(".cat").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    history.replaceState(null, "", id === "all" ? location.pathname : "#" + id);
    render(id);
  });
}
const start = location.hash.slice(1);
render(CATS.some(c => c.id === start) ? start : "all");
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); render(CATS.some(c => c.id === h) ? h : "all"); });
</script>
</body>
</html>
